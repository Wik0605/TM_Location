<div id="results-card"
     class="bg-white p-5 rounded-3xl shadow-[0_4px_16px_rgba(0,0,0,0.06)] border border-[color:var(--color-border)]"
     style="display:none;">
    <h3 class="font-display text-sm font-black text-ink tracking-tight mb-4 uppercase">
        Résumé estimatif
    </h3>
    <div class="space-y-2">
        <div class="flex justify-between items-center py-2 border-b border-[color:var(--color-border)]">
            <span class="text-xs font-semibold text-[color:var(--color-neutral)] uppercase tracking-wider" id="res-rental-label">Location</span>
            <span class="text-sm font-semibold text-[color:var(--color-neutral-strong)]" id="res-rental-cost">—</span>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-[color:var(--color-border)]">
            <span class="text-xs font-semibold text-[color:var(--color-neutral)] uppercase tracking-wider">Carburant estimé</span>
            <span class="text-sm font-semibold text-[color:var(--color-neutral-strong)]"><span id="res-fuel-cost">0</span> Ar</span>
        </div>
        <div class="flex justify-between items-center py-3 bg-[color:var(--color-primary-light)] px-3 rounded-2xl mt-2">
            <span class="font-display font-black text-ink uppercase text-sm tracking-tight">Total</span>
            <span class="font-display font-black text-primary text-xl tracking-tight">
                <span id="res-total-cost">0</span> Ar
            </span>
        </div>
    </div>
    <p class="text-[10px] text-[color:var(--color-neutral)] mt-3 text-center font-medium">
        * Estimation indicative, le coût réel peut varier.
    </p>
    <p class="fallback-note text-[10px] text-primary-dark mt-1 text-center font-semibold" style="display:none;">
        ⚠️ Distance calculée à vol d'oiseau (serveurs de routage indisponibles).
    </p>

    <!-- Avertissements snap (remplis par JS quand walk_m > seuil) -->
    <div id="snap-warnings"></div>

    <div id="devis-actions" class="mt-4 grid grid-cols-2 gap-2">
        <button type="button" id="devis-print-btn"
                class="flex items-center justify-center gap-2 bg-ink text-white py-3 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-primary transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Télécharger
        </button>
        <a id="devis-whatsapp-btn" href="#"
           class="flex items-center justify-center gap-2 bg-success text-white py-3 rounded-2xl font-bold text-xs uppercase tracking-widest hover:opacity-90 transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.23 8.23 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.22-8.22 8.22z"/></svg>
            WhatsApp
        </a>
    </div>
</div>

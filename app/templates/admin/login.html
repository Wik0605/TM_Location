<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin — TM_Location</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dist.css">
    <style>
        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #0A0A0A 0%, #1a1208 45%, #B45309 100%);
            min-height: 100vh;
        }
        .hero-hatch {
            background-image: repeating-linear-gradient(
                45deg,
                transparent 0,
                transparent 14px,
                rgba(252, 211, 77, 0.05) 14px,
                rgba(252, 211, 77, 0.05) 15px
            );
        }
        .font-display { font-family: var(--font-display); }
        .btn-ambre {
            background: var(--color-primary);
            transition: background-color .2s, transform .2s, box-shadow .2s;
        }
        .btn-ambre:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        .field-input {
            background: #FFFFFF;
            border: 1px solid var(--color-border-strong);
            transition: border-color .2s, box-shadow .2s;
        }
        .field-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="hero-hatch flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <p class="text-[10px] text-[#FCD34D] uppercase tracking-[0.3em] font-semibold mb-2">TM_Location</p>
            <h1 class="font-display text-3xl font-black text-white tracking-tight">
                Espace <span style="color: #FCD34D;">Admin</span>
            </h1>
            <p class="text-sm text-white/60 mt-2">Connexion sécurisée</p>
        </div>

        <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/10">

            {% if error %}
            <div class="mb-5 bg-[#FEF2F2] border border-[#FCA5A5] text-[#991B1B] text-sm rounded-xl px-4 py-3 flex items-start gap-2">
                <span class="text-lg leading-none">⚠</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" class="space-y-5">
                {{ csrf_input(request) }}
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-widest text-[color:var(--color-neutral-strong)] mb-2">Identifiant</label>
                    <input type="text" name="username" required autofocus
                        class="field-input w-full rounded-xl px-4 py-3 text-sm text-[color:var(--color-ink)] placeholder-[color:var(--color-neutral)]"
                        placeholder="admin">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-widest text-[color:var(--color-neutral-strong)] mb-2">Mot de passe</label>
                    <input type="password" name="password" required
                        class="field-input w-full rounded-xl px-4 py-3 text-sm text-[color:var(--color-ink)] placeholder-[color:var(--color-neutral)]"
                        placeholder="••••••••">
                </div>
                <button type="submit"
                    class="btn-ambre w-full text-white font-semibold rounded-full px-4 py-3.5 text-sm tracking-wide shadow-md">
                    Se connecter
                </button>
            </form>
        </div>

        <p class="text-center mt-6">
            <a href="/" class="text-xs text-white/60 hover:text-[#FCD34D] transition-colors tracking-wide">← Retour au site</a>
        </p>
    </div>

</body>
</html>

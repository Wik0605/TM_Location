<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — TM_Location</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dist.css">
    <script src="/static/js/vendor/htmx.min.js"></script>
    <style>
        body {
            font-family: var(--font-main);
            background: var(--color-neutral-soft);
            color: var(--color-ink);
        }
        .font-display { font-family: var(--font-display); }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-swapping { opacity: 0; transition: opacity 150ms ease-out; }
        .htmx-settling { opacity: 1; transition: opacity 150ms ease-in; }

        .sidebar-bg {
            background: linear-gradient(180deg, #0A0A0A 0%, #1a1208 100%);
        }
        .nav-item {
            transition: background-color .2s, color .2s, transform .2s;
        }
        .nav-item:hover { background: rgba(252, 211, 77, 0.08); color: #FCD34D; }
        .nav-item.active {
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.25) 0%, rgba(217, 119, 6, 0) 100%);
            color: #FCD34D;
            border-left: 3px solid var(--color-primary);
            padding-left: calc(0.75rem - 3px);
        }
        .brand-dot {
            width: 8px; height: 8px; border-radius: 999px;
            background: var(--color-primary);
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.7);
        }
    </style>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>

    <!-- Header mobile -->
    <header class="lg:hidden sidebar-bg text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="brand-dot"></div>
            <div>
                <p class="text-[10px] text-white/60 uppercase tracking-[0.25em]">TM_Location</p>
                <p class="font-display font-bold text-sm">Admin</p>
            </div>
        </div>
        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
            class="p-2 rounded-lg hover:bg-white/10 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </header>

    <!-- Menu mobile déroulant -->
    <nav id="mobile-menu" class="hidden lg:hidden sidebar-bg text-white px-3 py-3 space-y-1 border-t border-white/5">
        <a href="/admin" class="nav-item {% if active == 'dashboard' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
            <span>📊</span> Dashboard
        </a>
        <a href="/admin/reservations" class="nav-item {% if active == 'reservations' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
            <span>📋</span> Réservations
        </a>
        <a href="/admin/voitures" class="nav-item {% if active == 'voitures' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
            <span>🚗</span> Voitures
        </a>
        <div class="pt-2 mt-2 border-t border-white/10 space-y-1">
            <a href="/" class="block px-3 py-2 text-xs text-white/50 hover:text-[#FCD34D] transition-colors">← Retour au site</a>
            <a href="/admin/logout" class="block px-3 py-2 text-xs text-[#FCA5A5] hover:text-white transition-colors">Déconnexion</a>
        </div>
    </nav>

    <div class="flex min-h-screen">

        <!-- Sidebar desktop -->
        <aside class="hidden lg:flex w-60 sidebar-bg text-white flex-col min-h-screen fixed top-0 left-0 z-40 shadow-2xl">
            <div class="px-6 py-6 border-b border-white/10">
                <div class="flex items-center gap-2.5 mb-1">
                    <div class="brand-dot"></div>
                    <p class="text-[10px] text-white/60 uppercase tracking-[0.25em] font-semibold">TM_Location</p>
                </div>
                <p class="font-display font-black text-xl tracking-tight">
                    Espace <span style="color: #FCD34D;">Admin</span>
                </p>
            </div>
            <nav class="flex-1 px-3 py-6 space-y-1">
                <a href="/admin" class="nav-item {% if active == 'dashboard' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
                    <span>📊</span> Dashboard
                </a>
                <a href="/admin/reservations" class="nav-item {% if active == 'reservations' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
                    <span>📋</span> Réservations
                </a>
                <a href="/admin/voitures" class="nav-item {% if active == 'voitures' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80">
                    <span>🚗</span> Voitures
                </a>
            </nav>
            <div class="px-6 py-5 border-t border-white/10 space-y-2">
                <a href="/" class="block text-xs text-white/50 hover:text-[#FCD34D] transition-colors">← Retour au site</a>
                <a href="/admin/logout" class="block text-xs text-[#FCA5A5] hover:text-white transition-colors">Déconnexion</a>
            </div>
        </aside>

        <!-- Contenu principal -->
        <main class="flex-1 lg:ml-60 p-4 lg:p-8">
            {% block content %}{% endblock %}
        </main>

    </div>

</body>
</html>

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tml-pg
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tm_location
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
